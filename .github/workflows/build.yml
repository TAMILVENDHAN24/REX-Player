name: CI/CD Build

on:
  pull_request:
  # Build straight from a push to the all-in-one branch (no pull request needed).
  push:
    branches:
      - all-in-one-v5.5.1
  # Manual run; GitHub only shows the "Run workflow" button once this file is on the default branch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      # Chaquopy runs the host Python interpreter to package each flavor's
      # requirements. Keep both flavor versions on PATH for the build.
      - name: Setup Python 3.11 (standard flavor)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Python 3.13 (impersonation flavor)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleStandardDebug assembleImpersonationDebug

      - name: Upload app-arm64-v8a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-arm64-v8a-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/debug/app-standard-arm64-v8a-debug.apk
      - name: Upload app-armeabi-v7a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-armeabi-v7a-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/debug/app-standard-armeabi-v7a-debug.apk
      - name: Upload app-universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-universal-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/debug/app-standard-universal-debug.apk
      - name: Upload app-x86 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-x86-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/debug/app-standard-x86-debug.apk
      - name: Upload app-x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-x86_64-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/debug/app-standard-x86_64-debug.apk
      - name: Upload arm64 impersonation APK (installable debug build)
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-arm64-impersonation-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/impersonation/debug/app-impersonation-arm64-v8a-debug.apk
